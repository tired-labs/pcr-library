# Creates a working branch with a new, pre-populated coverage record.
#
# INSTANCES OVERRIDE THIS FILE. Workflow inputs are static YAML, so an
# integration cannot contribute a dropdown at runtime. An instance that needs
# provider-specific inputs (an Anvilogic domain, say) adds them to the inputs
# block below and keeps its own copy of this file.
#
# To keep that divergence cheap, every input is forwarded verbatim to
# create_record.py as JSON, which passes them to the provider's
# on_record_created hook in context.options. The run step therefore needs no
# changes when inputs are added, and porting an upstream fix means copying the
# steps and keeping your own inputs block.
name: Create New Record
run-name: Creating a new ${{ inputs.record_type }} record

on:
  # Manual runs are the only kind: this workflow has no automatic trigger.
  # Pick the record type and provider; it scaffolds the record on a new
  # branch, which you then fill in and open a pull request from. Nothing is
  # written to main.
  workflow_dispatch:
    inputs:
      record_type:
        description: 'Type of record to create'
        required: true
        type: choice
        options:
          - Coverage
          - Gap
          - Opportunity
      provider:
        description: 'Provider supplying the coverage (leave blank for Gap and Opportunity)'
        required: false
        type: string
      branch_name:
        description: 'Branch to create (leave blank for record/<timestamp>)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-record:
    # Instances using self-hosted runners will need to change this.
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v7

    # The branch is settled before anything else happens, because the
    # provider's hook is told its name and may record it on the provider's
    # side -- to link a new detection back to the branch holding its record.
    # The name chosen here is the one pushed, unchanged. An invalid name is
    # rejected rather than rewritten, so the name you type is the name you get
    # in GitHub and in the provider.
    #
    # Inputs reach every script through the environment, never interpolated
    # into it, where a crafted value would run as shell.
    - name: Choose the branch name
      id: branch
      env:
        REQUESTED: ${{ inputs.branch_name }}
      run: |
        if [ -n "${REQUESTED}" ]; then
          branch="${REQUESTED}"
        else
          branch="record/$(date -u +%Y%m%d-%H%M%S)"
        fi

        # Checked as a full ref so that shorthand such as @{-1} is never
        # expanded. Rejects spaces, control characters, and the other
        # characters git does not allow. A leading '-' passes that check but
        # would be read as an option by every git command it is given to.
        if [[ "${branch}" == -* ]] || ! git check-ref-format "refs/heads/${branch}"; then
          echo "::error::The requested branch name is not a valid git branch name. Use letters, digits, '-', '_', '.' and '/'; no spaces."
          exit 1
        fi

        if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
          echo "::error::A branch named ${branch} already exists. Choose another name, or leave it blank for a generated one."
          exit 1
        fi

        echo "name=${branch}" >> "$GITHUB_OUTPUT"
        echo "Records will be created on ${branch}."

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # Integrations declare their own dependencies in
    # local/integrations/<slug>/requirements.txt. Core installs whatever it
    # finds, so adding a provider never means editing a workflow.
    - name: Install provider dependencies
      run: python3 tools/install_provider_deps.py

    - name: Create the record
      id: create
      # ---------------------------------------------------------------
      # PROVIDER CREDENTIALS -- known override point.
      #
      # GitHub will not let a workflow enumerate `secrets`, so core cannot
      # forward credentials it does not know the names of. Add each
      # provider's secrets here in your own copy of this file, and expect to
      # re-add them when you port an upstream change. See docs/DEPLOYMENT.md.
      #
      #   PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
      #   PROVIDER_API_URL: "https://provider.com"
      # ---------------------------------------------------------------
      env:
        # Lets a hook build a link back to the record it was given.
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/
        RECORD_TYPE: ${{ inputs.record_type }}
        PROVIDER: ${{ inputs.provider }}
        BRANCH: ${{ steps.branch.outputs.name }}
        OPTIONS: ${{ toJSON(inputs) }}
      run: |
        args=(--type "${RECORD_TYPE}" --branch "${BRANCH}" --options "${OPTIONS}")
        if [ -n "${PROVIDER}" ]; then
          args+=(--provider "${PROVIDER}")
        fi
        python3 tools/create_record.py "${args[@]}"

    - name: Push the working branch
      env:
        RECORD_TYPE: ${{ inputs.record_type }}
        BRANCH: ${{ steps.branch.outputs.name }}
        BRANCH_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.branch.outputs.name }}
      run: |
        git config --local user.email "Records-Bot@users.noreply.github.com"
        git config --local user.name "Records-Bot"
        git checkout -b "${BRANCH}"
        git add records/
        git commit -m "Scaffold new ${RECORD_TYPE} record"
        git push origin "${BRANCH}"
        echo "Created branch ${BRANCH}"
        echo "### New record branch: [\`${BRANCH}\`](${BRANCH_URL})" >> "$GITHUB_STEP_SUMMARY"
